# === ReyniBio Media Server ===
# 8 services, 2 networks, Intel QuickSync transcoding
# Start: docker compose up -d

networks:
  reyni-vpn:
    name: reyni-vpn
  reyni-media:
    name: reyni-media

services:
  # ── VPN Tunnel ──────────────────────────────────────
  gluetun:
    image: qmcgaw/gluetun:v3
    container_name: reyni-gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "8080:8080"   # qBittorrent WebUI (routed through VPN)
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=${VPN_TYPE}
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - SERVER_COUNTRIES=${VPN_SERVER_COUNTRY}
    volumes:
      - ${CONFIG_DIR}/gluetun:/gluetun
    networks:
      - reyni-vpn
      - reyni-media
    restart: unless-stopped

  # ── Torrent Client (behind VPN) ─────────────────────
  qbittorrent:
    image: qbittorrentofficial/qbittorrent-nox:5.1.4
    container_name: reyni-qbittorrent
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - QBT_EULA=accept
      - QBT_WEBUI_PORT=8080
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=${UMASK}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_DIR}/qbittorrent:/config
      - ${DATA_DIR}/torrents:/data/torrents
    restart: unless-stopped

  # ── Indexer Manager ─────────────────────────────────
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:1.32
    container_name: reyni-prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=${UMASK}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_DIR}/prowlarr:/config
    ports:
      - "9696:9696"
    networks:
      - reyni-media
    restart: unless-stopped

  # ── TV Shows ────────────────────────────────────────
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.14
    container_name: reyni-sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=${UMASK}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_DIR}/sonarr:/config
      - ${DATA_DIR}:/data
    ports:
      - "8989:8989"
    networks:
      - reyni-media
    restart: unless-stopped

  # ── Movies ──────────────────────────────────────────
  radarr:
    image: lscr.io/linuxserver/radarr:5.22
    container_name: reyni-radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=${UMASK}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_DIR}/radarr:/config
      - ${DATA_DIR}:/data
    ports:
      - "7878:7878"
    networks:
      - reyni-media
    restart: unless-stopped

  # ── Subtitles ───────────────────────────────────────
  bazarr:
    image: lscr.io/linuxserver/bazarr:1.5
    container_name: reyni-bazarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=${UMASK}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_DIR}/bazarr:/config
      - ${DATA_DIR}/media:/data/media
    ports:
      - "6767:6767"
    networks:
      - reyni-media
    restart: unless-stopped

  # ── Media Server (Intel QuickSync) ──────────────────
  jellyfin:
    image: jellyfin/jellyfin:10.11.6
    container_name: reyni-jellyfin
    user: "${PUID}:${PGID}"
    group_add:
      - "${RENDER_GID}"
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ${CONFIG_DIR}/jellyfin:/config
      - ${DATA_DIR}/media:/data/media:ro
    ports:
      - "8096:8096"
    networks:
      - reyni-media
    restart: unless-stopped

  # ── Request Management ──────────────────────────────
  jellyseerr:
    image: fallenbagel/jellyseerr:2.3
    container_name: reyni-jellyseerr
    environment:
      - TZ=${TZ}
    volumes:
      - ${CONFIG_DIR}/jellyseerr:/app/config
    ports:
      - "5055:5055"
    networks:
      - reyni-media
    restart: unless-stopped
